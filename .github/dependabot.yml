version: 2

updates:
  # Keep GitHub Actions pinned SHAs current
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "ci"
    labels:
      - dependencies

  # Backend npm dependencies
  - package-ecosystem: npm
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "deps(backend)"
    labels:
      - dependencies
    # At most 1 non-security PR open at a time. Security updates always get
    # their own PR regardless of this limit.
    open-pull-requests-limit: 1
    # Group all version types into one PR. Major bumps are included so they
    # don't create a separate flood; TypeScript strict mode + CI will catch
    # any breaking changes before merge.
    groups:
      backend-all:
        update-types:
          - major
          - minor
          - patch

  # Frontend npm dependencies
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "deps(frontend)"
    labels:
      - dependencies
    open-pull-requests-limit: 1
    groups:
      frontend-all:
        update-types:
          - major
          - minor
          - patch
