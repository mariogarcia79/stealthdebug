version: 2

updates:
  # Keep GitHub Actions pinned SHAs current
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "ci"
    labels:
      - dependencies

  # Backend npm dependencies
  - package-ecosystem: npm
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "deps(backend)"
    labels:
      - dependencies
    # At most 1 non-security PR open at a time. Security updates always get
    # their own PR regardless of this limit.
    open-pull-requests-limit: 1
    # Group minor + patch into one PR. Major bumps are kept OUT of the group:
    # bundling them (express 5, mongoose 9, TypeScript 7...) produced one PR
    # that could not even install, so nothing in it could be merged. Majors
    # arrive as individual PRs that can be migrated and reviewed one at a time.
    groups:
      backend-all:
        update-types:
          - minor
          - patch
    ignore:
      # TypeScript 7 is incompatible with ts-jest 29 (peer typescript <7).
      # Remove once ts-jest supports it.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]

  # Frontend npm dependencies
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "deps(frontend)"
    labels:
      - dependencies
    open-pull-requests-limit: 1
    # See backend note: majors come as individual PRs.
    groups:
      frontend-all:
        update-types:
          - minor
          - patch
    ignore:
      # Keep TypeScript in lockstep with the backend (see note above).
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
