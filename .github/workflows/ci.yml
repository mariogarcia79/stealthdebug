name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  typecheck:
    name: Type check
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node (backend)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend deps
        run: npm ci --prefer-offline
        working-directory: backend

      - name: Type-check backend
        run: npx --no-install tsc --noEmit
        working-directory: backend

      - name: Set up Node (frontend)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        run: npm ci --prefer-offline
        working-directory: frontend

      - name: Type-check frontend
        run: npx --no-install tsc --noEmit
        working-directory: frontend

  test:
    name: Tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install deps
        run: npm ci --prefer-offline
        working-directory: backend

      - name: Run tests
        run: npm test
        working-directory: backend

  audit-deps:
    name: Dependency audit
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # --omit=dev: devDependencies are not installed in production (Dockerfile
      # uses npm ci --omit=dev), so auditing them would produce misleading failures.
      - name: Audit backend (prod deps only)
        run: npm audit --audit-level=high --omit=dev
        working-directory: backend

      - name: Audit frontend
        run: npm audit --audit-level=high
        working-directory: frontend

  trivy-fs:
    name: Trivy filesystem scan
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Scan repository
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          ignore-unfixed: true
          # Without this, trivy-action drops --severity for SARIF output and
          # exit-code 1 fires on ANY finding (LOW/MEDIUM included).
          limit-severities-for-sarif: true
          format: sarif
          output: trivy-fs.sarif
          severity: HIGH,CRITICAL
          exit-code: '1'

      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs

  build-images:
    name: Build images
    runs-on: ubuntu-24.04
    needs: [typecheck, test, audit-deps]
    permissions:
      contents: read
      packages: write
    outputs:
      backend-digest: ${{ steps.build-backend.outputs.digest }}
      frontend-digest: ${{ steps.build-frontend.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Changes once a week so the cached `apt-get upgrade` / `apk upgrade`
      # layer is rebuilt and picks up OS security fixes.
      - name: Compute weekly security refresh key
        id: refresh
        run: echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to ghcr.io
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build backend
        id: build-backend
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./backend
          build-args: |
            SECURITY_REFRESH=${{ steps.refresh.outputs.week }}
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/${{ github.repository }}/backend:${{ github.sha }}
            ghcr.io/${{ github.repository }}/backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend
        id: build-frontend
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./frontend
          build-args: |
            SECURITY_REFRESH=${{ steps.refresh.outputs.week }}
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/${{ github.repository }}/frontend:${{ github.sha }}
            ghcr.io/${{ github.repository }}/frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  trivy-images:
    name: Trivy image scan
    runs-on: ubuntu-24.04
    needs: build-images
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      security-events: write
      packages: read
    steps:
      - name: Log in to ghcr.io
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Scan backend image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ghcr.io/${{ github.repository }}/backend:${{ github.sha }}
          ignore-unfixed: true
          # Without this, trivy-action drops --severity for SARIF output and
          # exit-code 1 fires on ANY finding (LOW/MEDIUM included).
          limit-severities-for-sarif: true
          format: sarif
          output: trivy-backend.sarif
          severity: HIGH,CRITICAL
          exit-code: '1'

      - name: Scan frontend image
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ghcr.io/${{ github.repository }}/frontend:${{ github.sha }}
          ignore-unfixed: true
          # Without this, trivy-action drops --severity for SARIF output and
          # exit-code 1 fires on ANY finding (LOW/MEDIUM included).
          limit-severities-for-sarif: true
          format: sarif
          output: trivy-frontend.sarif
          severity: HIGH,CRITICAL
          exit-code: '1'

      - name: Upload backend SARIF
        if: always() && hashFiles('trivy-backend.sarif') != ''
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: trivy-backend.sarif
          category: trivy-backend

      - name: Upload frontend SARIF
        if: always() && hashFiles('trivy-frontend.sarif') != ''
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: trivy-frontend.sarif
          category: trivy-frontend

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-24.04
    needs: [build-images, trivy-images]
    if: github.ref == 'refs/heads/main'
    environment: production
    # One deploy at a time; a newer push waits for the running deploy instead
    # of cancelling it halfway (deploy.sh also takes a lock on the VPS).
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "${{ secrets.VPS_SSH_HOST_KEY }}" > ~/.ssh/known_hosts

      - name: Deploy
        env:
          BACKEND_IMAGE: ghcr.io/${{ github.repository }}/backend:${{ github.sha }}
          FRONTEND_IMAGE: ghcr.io/${{ github.repository }}/frontend:${{ github.sha }}
          DEPLOY_SHA: ${{ github.sha }}
          SSH_USER: ${{ secrets.VPS_SSH_USER }}
          SSH_HOST: ${{ secrets.VPS_SSH_HOST }}
          APP_DIR: ${{ secrets.VPS_APP_DIR }}
        run: |
          # export sets the vars for the entire remote session; env-var prefix
          # on a builtin like `cd` does NOT persist to subsequent commands.
          ssh -i ~/.ssh/deploy_key "${SSH_USER}@${SSH_HOST}" \
            "export BACKEND_IMAGE='${BACKEND_IMAGE}' FRONTEND_IMAGE='${FRONTEND_IMAGE}' DEPLOY_SHA='${DEPLOY_SHA}' && cd '${APP_DIR}' && ./deploy.sh"

      - name: Health check
        env:
          SSH_USER: ${{ secrets.VPS_SSH_USER }}
          SSH_HOST: ${{ secrets.VPS_SSH_HOST }}
        run: |
          for i in $(seq 1 10); do
            STATUS=$(ssh -i ~/.ssh/deploy_key "${SSH_USER}@${SSH_HOST}" \
              "systemctl --user is-active webpage-pod.service 2>/dev/null || echo inactive")
            if [ "$STATUS" = "active" ]; then
              echo "Service is active."
              exit 0
            fi
            echo "Attempt $i: service not active yet, waiting 10s..."
            sleep 10
          done
          echo "ERROR: Service did not become active within 100s."
          exit 1
