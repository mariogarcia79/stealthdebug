name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  typecheck:
    name: Type check
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node (backend)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend deps
        run: npm ci --prefer-offline
        working-directory: backend

      - name: Type-check backend
        run: npx --no-install tsc --noEmit
        working-directory: backend

      - name: Set up Node (frontend)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        run: npm ci --prefer-offline
        working-directory: frontend

      - name: Type-check frontend
        run: npx --no-install tsc --noEmit
        working-directory: frontend

  test:
    name: Tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install deps
        run: npm ci --prefer-offline
        working-directory: backend

      - name: Run tests
        run: npm test
        working-directory: backend

  audit-deps:
    name: Dependency audit
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # --omit=dev: devDependencies are not installed in production (Dockerfile
      # uses npm ci --omit=dev), so auditing them would produce misleading failures.
      - name: Audit backend (prod deps only)
        run: npm audit --audit-level=high --omit=dev
        working-directory: backend

      - name: Audit frontend
        run: npm audit --audit-level=high
        working-directory: frontend

  trivy-fs:
    name: Trivy filesystem scan
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Scan repository
        uses: aquasecurity/trivy-action@6e7b7d1fd3e4fef0c5fa8cce1229c54b2c9bd0d8 # v0.24.0
        with:
          scan-type: fs
          scan-ref: .
          ignore-unfixed: true
          # Without this, trivy-action drops --severity for SARIF output and
          # exit-code 1 fires on ANY finding (LOW/MEDIUM included).
          limit-severities-for-sarif: true
          format: sarif
          output: trivy-fs.sarif
          severity: HIGH,CRITICAL
          exit-code: '1'

      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@fca7ace96b7d713c7035871441bd52efbe39e27e # v3.28.19
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs

  build-images:
    name: Build images
    runs-on: ubuntu-24.04
    needs: [typecheck, test, audit-deps]
    permissions:
      contents: read
      packages: write
    outputs:
      backend-digest: ${{ steps.build-backend.outputs.digest }}
      frontend-digest: ${{ steps.build-frontend.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      - name: Log in to ghcr.io
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build backend
        id: build-backend
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: ./backend
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/${{ github.repository }}/backend:${{ github.sha }}
            ghcr.io/${{ github.repository }}/backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend
        id: build-frontend
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: ./frontend
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/${{ github.repository }}/frontend:${{ github.sha }}
            ghcr.io/${{ github.repository }}/frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  trivy-images:
    name: Trivy image scan
    runs-on: ubuntu-24.04
    needs: build-images
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      security-events: write
      packages: read
    steps:
      - name: Log in to ghcr.io
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Scan backend image
        uses: aquasecurity/trivy-action@6e7b7d1fd3e4fef0c5fa8cce1229c54b2c9bd0d8 # v0.24.0
        with:
          scan-type: image
          image-ref: ghcr.io/${{ github.repository }}/backend:${{ github.sha }}
          ignore-unfixed: true
          # Without this, trivy-action drops --severity for SARIF output and
          # exit-code 1 fires on ANY finding (LOW/MEDIUM included).
          limit-severities-for-sarif: true
          format: sarif
          output: trivy-backend.sarif
          severity: HIGH,CRITICAL
          exit-code: '1'

      - name: Scan frontend image
        uses: aquasecurity/trivy-action@6e7b7d1fd3e4fef0c5fa8cce1229c54b2c9bd0d8 # v0.24.0
        with:
          scan-type: image
          image-ref: ghcr.io/${{ github.repository }}/frontend:${{ github.sha }}
          ignore-unfixed: true
          # Without this, trivy-action drops --severity for SARIF output and
          # exit-code 1 fires on ANY finding (LOW/MEDIUM included).
          limit-severities-for-sarif: true
          format: sarif
          output: trivy-frontend.sarif
          severity: HIGH,CRITICAL
          exit-code: '1'

      - name: Upload backend SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@fca7ace96b7d713c7035871441bd52efbe39e27e # v3.28.19
        with:
          sarif_file: trivy-backend.sarif
          category: trivy-backend

      - name: Upload frontend SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@fca7ace96b7d713c7035871441bd52efbe39e27e # v3.28.19
        with:
          sarif_file: trivy-frontend.sarif
          category: trivy-frontend

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-24.04
    needs: [build-images, trivy-images]
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "${{ secrets.VPS_SSH_HOST_KEY }}" > ~/.ssh/known_hosts

      - name: Deploy
        env:
          BACKEND_IMAGE: ghcr.io/${{ github.repository }}/backend:${{ github.sha }}
          FRONTEND_IMAGE: ghcr.io/${{ github.repository }}/frontend:${{ github.sha }}
          SSH_USER: ${{ secrets.VPS_SSH_USER }}
          SSH_HOST: ${{ secrets.VPS_SSH_HOST }}
          APP_DIR: ${{ secrets.VPS_APP_DIR }}
        run: |
          # export sets the vars for the entire remote session; env-var prefix
          # on a builtin like `cd` does NOT persist to subsequent commands.
          ssh -i ~/.ssh/deploy_key "${SSH_USER}@${SSH_HOST}" \
            "export BACKEND_IMAGE='${BACKEND_IMAGE}' FRONTEND_IMAGE='${FRONTEND_IMAGE}' && cd '${APP_DIR}' && ./deploy.sh"

      - name: Health check
        env:
          SSH_USER: ${{ secrets.VPS_SSH_USER }}
          SSH_HOST: ${{ secrets.VPS_SSH_HOST }}
        run: |
          for i in $(seq 1 10); do
            STATUS=$(ssh -i ~/.ssh/deploy_key "${SSH_USER}@${SSH_HOST}" \
              "systemctl --user is-active webpage-pod.service 2>/dev/null || echo inactive")
            if [ "$STATUS" = "active" ]; then
              echo "Service is active."
              exit 0
            fi
            echo "Attempt $i: service not active yet, waiting 10s..."
            sleep 10
          done
          echo "ERROR: Service did not become active within 100s."
          exit 1
