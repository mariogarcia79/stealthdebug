name: AI Security Review

on:
  pull_request:
    branches: [main]

# Minimum permissions: read code, write PR comments, and mint an OIDC token
# that the action exchanges for a Claude GitHub App token.
permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  claude-review:
    name: Claude code review
    runs-on: ubuntu-24.04
    # Skip fork PRs (no secret access) and bot-authored PRs (Dependabot bumps
    # don't need an AI security review and would burn subscription usage).
    if: |
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Claude security review
        uses: anthropics/claude-code-action@acfe7992852970efb4fee683d63d628e3e52df67 # v1.0.286
        with:
          # Claude Pro/Max subscription token from `claude setup-token`.
          # GitHub access comes from the Claude GitHub App via OIDC (id-token: write).
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request for security vulnerabilities and correctness issues.
            Focus on:
            - New authentication or authorization logic
            - Input validation and sanitisation gaps
            - Secrets or credentials in code or config
            - Dangerous patterns (eval, shell injection, SQL/NoSQL injection, XSS vectors)
            - Changes to Podman quadlet files, nginx config, or deployment scripts
            - Dependencies added or upgraded
            Post concise inline comments only where there is a specific, actionable finding.
            Skip style and formatting notes — this review is security and correctness only.
          # v1 runs prompts in automation mode with no tools pre-approved, so
          # allow reading the PR and posting inline/top-level comments.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
