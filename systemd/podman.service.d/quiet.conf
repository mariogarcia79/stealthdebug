# Installed by deploy.sh into ~/.config/systemd/user/podman.service.d/
#
# podman.service is Podman's API, started by podman.socket. podman-exporter
# queries it ~7 times per Prometheus scrape (every 15 s) and Podman logs each
# request at "info": ~40,000 identical journal lines a day that bury real
# messages. Keep warnings and errors, drop info/debug.
[Service]
LogLevelMax=notice
