# Security headers for the admin pages (/admin/...), where agent-proposed
# content is reviewed: the same as security-headers.conf except img-src,
# which allows no external image (previews can't leak to third-party URLs).
# Keep the two files in sync.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# script-src nonce: Cloudflare's Bot Fight Mode injects an inline "JavaScript
# detections" script into every HTML page (it can't be disabled with Bot Fight
# Mode). Cloudflare copies the nonce from this header onto that script, so it
# runs while every other inline script stays blocked. $request_id is 128 random
# bits, new for each response; the site itself doesn't use the nonce.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'nonce-$request_id'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; font-src 'self' data:; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;
add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=()" always;
