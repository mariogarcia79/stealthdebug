events {
    worker_connections 1024;
}

http {
    include /etc/nginx/cloudflare;

    # --- Visitor IP --------------------------------------------------------
    # Cloudflare sends the visitor's address in CF-Connecting-IP (it always
    # overwrites any value a client sends). Every connection to this server
    # comes from Cloudflare: "ssl_verify_client on" below only accepts
    # Cloudflare's origin-pull certificate. The connecting address itself
    # can't be checked against the Cloudflare ranges above, because rootless
    # Podman's port forwarding replaces it with an internal address, so the
    # header is trusted from any source. If ssl_verify_client is ever turned
    # off, remove the two 0/0 lines (only the Cloudflare ranges stay trusted).
    # "real_ip_header CF-Connecting-IP" itself is in /etc/nginx/cloudflare
    # (written by cloudflare-ip-whitelist-sync.sh); it must not be repeated.
    set_real_ip_from 0.0.0.0/0;
    set_real_ip_from ::/0;

    # Combined log format (what most tools parse) + response time and the
    # Cloudflare ray ID, to find a request in Cloudflare's dashboard.
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
                    'rt=$request_time cf_ray=$http_cf_ray';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log;

    upstream backend {
        server backend:4000;
    }

    upstream frontend {
        server frontend:80;
    }
    
    server {
        listen 443 ssl;
        server_name stealthdebug.org www.stealthdebug.org;

        server_tokens off;
        error_page 400 401 403 404 405 500 502 503 504 /200.html;

        include /etc/nginx/security-headers.conf;

        ssl_certificate /etc/nginx/certs/cloudflare-origin.pem;
        ssl_certificate_key /etc/nginx/certs/cloudflare-origin.key;

        ssl_client_certificate /etc/nginx/certs/cloudflare-pull.pem;
        ssl_verify_client on;
        ssl_verify_depth 2;

        ssl_protocols TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        client_max_body_size 12M;   # media uploads are limited to 10 MB by the backend

        location = /200.html {
            internal;
            add_header Content-Type text/plain;
            return 200 "Enumerate my ass ;)";
        }

        # Uploaded images and their resized copies, served straight from the
        # backend-uploads volume (read-only mount). File names are unique and
        # never rewritten, so browsers and Cloudflare may cache them for a year.
        # Management (upload/delete) is the backend's /api/media.
        location ^~ /api/uploads/ {
            alias /srv/uploads/;
            # This config doesn't include mime.types, so declare image types here
            # (otherwise files go out as text/plain).
            types {
                image/webp webp;
                image/png  png;
                image/jpeg jpg jpeg;
                image/gif  gif;
            }
            default_type application/octet-stream;
            limit_except GET { deny all; }
            autoindex off;
            try_files $uri =404;

            include /etc/nginx/security-headers.conf;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
        }

        # Sitemap (listed in robots.txt), generated by the backend from the posts
        location = /sitemap.xml {
            limit_except GET { deny all; }
            proxy_pass http://backend/api/sitemap.xml;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
        }

        # For AI tools (llms.txt convention) and Markdown copies of published
        # posts, generated by the backend: /blog/<id>.md, /blog/<id>.<lang>.md
        location = /llms.txt {
            limit_except GET { deny all; }
            proxy_pass http://backend/api/llms.txt;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
        }
        location ~ "^/blog/(?<mdfile>[0-9a-f]{24}(\.[a-z]{2})?\.md)$" {
            limit_except GET { deny all; }
            proxy_pass http://backend/api/md/$mdfile;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
        }

        location /api/ {
            proxy_pass http://backend;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

            proxy_set_header CF-Visitor $http_cf_visitor;
            proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
            proxy_set_header CF-RAY $http_cf_ray;
            proxy_set_header CF-IPCountry $http_cf_ipcountry;

            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;

            proxy_buffering off;
        }

        location / {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
        }
    }
}