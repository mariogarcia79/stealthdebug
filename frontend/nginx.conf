server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    location /favicon.svg {
        try_files $uri =404;
    }

    # Well-known URIs (RFC 8615): real files or a 404, never the app's index.html
    location = /.well-known/security.txt {
        default_type text/plain;
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }
    # Password managers' "change password" link (W3C Well-Known URL for Changing Passwords)
    location = /.well-known/change-password {
        return 302 /dashboard;
    }
    location /.well-known/ {
        try_files $uri =404;
    }

    location = /robots.txt {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
